[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-text-render"
version = "1.0.0"
description = "Thai-correct text rendering for Pillow, using HarfBuzz shaping and FreeType rasterization"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chonlapat Kaewnuch", email = "chonlapatkwnworks@gmail.com" }]
requires-python = ">=3.9"
keywords = ["thai", "harfbuzz", "pillow", "freetype", "text-rendering", "complex-script"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Fonts",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "uharfbuzz>=0.39",
    "freetype-py>=2.4",
]

[project.urls]
Homepage = "https://github.com/anthonychkwn/thai-text-render"
Issues = "https://github.com/anthonychkwn/thai-text-render/issues"

[tool.setuptools]
py-modules = ["thai_text_render"]
